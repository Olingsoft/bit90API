# ─────────────────────────────────────────────────────────────────────────────
# Nginx Configuration — M-Pesa Callback Proxy
# ─────────────────────────────────────────────────────────────────────────────
#
# This is a REFERENCE configuration snippet. Merge it into your existing
# Nginx server block for api.bit90.online.
#
# File location (typical): /etc/nginx/sites-available/api.bit90.online
#
# After editing, test and reload:
#   sudo nginx -t
#   sudo systemctl reload nginx
# ─────────────────────────────────────────────────────────────────────────────

server {
    listen 443 ssl;
    server_name api.bit90.online;

    # SSL certificates (adjust paths to your actual cert files)
    ssl_certificate     /etc/letsencrypt/live/api.bit90.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.bit90.online/privkey.pem;

    # ── M-Pesa Callback ──────────────────────────────────────────────────
    # CRITICAL: This endpoint must NOT redirect, must accept POST,
    # and must proxy directly to Node.js without buffering.
    location /users/mpesa/callback {
        # Do NOT redirect POST to GET — this would break the callback
        # Do NOT add trailing slash redirects

        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable request buffering — forward the POST body immediately
        proxy_request_buffering off;

        # Increase timeout for slow responses (though our callback returns 200 instantly)
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # ── All other API routes ─────────────────────────────────────────────
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (for Socket.IO)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# ── HTTP to HTTPS redirect ───────────────────────────────────────────────────
server {
    listen 80;
    server_name api.bit90.online;

    # Redirect all HTTP to HTTPS — EXCEPT M-Pesa callback fallback
    # (In case Safaricom sends to HTTP for some reason)
    location /users/mpesa/callback {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
    }

    location / {
        return 301 https://$server_name$request_uri;
    }
}
